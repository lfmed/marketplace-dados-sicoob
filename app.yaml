# Databricks Apps — configuração do Marketplace de Dados (Flask + Gunicorn).
# Ajuste os valores de env para a workspace do cliente (ver docs/DEPLOY.md).
command: ["gunicorn", "-c", "gunicorn.conf.py", "app:app"]

env:
  # Unity Catalog: catálogo é PARÂMETRO (o app só cria/concede em schemas).
  - name: UC_CATALOG
    value: "stable_classic_pg4xe1_catalog"
  - name: UC_SCHEMA_PREFIX
    value: "mkt"
  # SQL Warehouse para executar GRANT/REVOKE/DDL no UC.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "b8e52268d9828bdd"
  # Lakebase (base operacional do App).
  - name: LAKEBASE_ENDPOINT
    value: "projects/marketplace-dados/branches/production/endpoints/primary"
  - name: LAKEBASE_DBNAME
    value: "databricks_postgres"
  # Efetivação real de acessos (GRANT/REVOKE reais no UC).
  - name: GRANT_EXECUTE_REAL
    value: "true"
  # Deploy SEM CLI: a app cria o schema de workflow (marketplace_app) no Lakebase na subida
  # e loga cada ponto provisionado/verificado (ver App ▸ Logs). Idempotente. Default true.
  - name: AUTO_BOOTSTRAP_APP_SCHEMA
    value: "true"
  # Escopo dos grupos da concessão por associação. Dev sem conta: "workspace".
  # PRODUÇÃO/cliente: "account" (grupos de conta = principais do UC) + DATABRICKS_ACCOUNT_ID,
  # e o SP do app precisa de direito de GERENTE desses grupos de conta (ou admin de conta).
  - name: GROUPS_SCOPE
    value: "workspace"
  # - name: DATABRICKS_ACCOUNT_ID
  #   value: "<account-id-do-cliente>"
  # Modelo oficial do cliente — catálogo/schemas parametrizáveis (dev usa os defaults).
  # No cliente: GOV_CATALOG=plataforma; schemas governanca/gestao_acesso/marketplace_app;
  # PROVISION_GROUP_GRANT=false (o Motor já concede o grant do grupo — app só faz membership).
  # - name: GOV_CATALOG
  #   value: "plataforma"
  # - name: SCHEMA_GOVERNANCA
  #   value: "governanca"
  # - name: SCHEMA_GESTAO
  #   value: "gestao_acesso"
  # - name: SCHEMA_APP
  #   value: "marketplace_app"
  # - name: PROVISION_GROUP_GRANT
  #   value: "false"
  # Proxy "atuar como" (demo). Em produção com SSO real, defina "false".
  - name: APP_ENABLE_PROXY
    value: "true"
  # FLASK_SECRET_KEY: em produção, crie um app secret e referencie via valueFrom.
  # Ex.: databricks apps ... + resource secret; depois:
  #   - name: FLASK_SECRET_KEY
  #     valueFrom: "flask-secret"
  # Sem isso, usa-se um default de desenvolvimento (app/config.py).
